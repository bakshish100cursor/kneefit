<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1F4E78"><link rel="manifest" href="manifest.json"><title>KneeFit</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f3f6fa;color:#222}
header{background:#1F4E78;color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0 0 8px}
select,input,button{font:inherit}
.row{display:flex;gap:6px;flex-wrap:wrap}
.tab{flex:1;min-width:40px;padding:8px 2px;border:0;border-radius:6px;background:#3b6a96;color:#fff;font-size:13px}
.tab.on{background:#fff;color:#1F4E78;font-weight:700}
.tab.fin{outline:2px solid #7ddc82}
main{padding:10px;max-width:700px;margin:auto}
.card{background:#fff;border-radius:10px;padding:10px;margin-bottom:10px;box-shadow:0 1px 3px #0002}
.card h3{margin:0 0 2px;font-size:16px;color:#1F4E78;cursor:pointer;text-decoration:underline dotted}
.tgt{font-size:13px;color:#555;margin-bottom:2px}
.last{font-size:12px;color:#2e7d32;margin-bottom:6px}
.sr{display:grid;gap:6px;align-items:center;margin-bottom:5px;font-size:13px;color:#555}
.sr.w{grid-template-columns:44px 1fr 1fr}.sr.n{grid-template-columns:44px 1fr}
.sr input,.f input{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:6px;background:#fffbe6}
.sr input:disabled{background:#eee;color:#444}
.f{display:grid;grid-template-columns:1fr 1fr;gap:6px}.f label{font-size:11px;color:#666;display:block}
#modal{display:none;position:fixed;inset:0;background:#0008;z-index:9;align-items:center;justify-content:center;padding:20px}
#modal div{background:#fff;border-radius:12px;padding:18px;max-width:480px}
button.b{padding:12px;border:0;border-radius:8px;background:#1F4E78;color:#fff;margin:4px 4px 0 0}
button.ok{background:#2e7d32;width:100%;font-size:17px;margin-top:6px}
button.ed{background:#ef6c00;width:100%;font-size:17px}
.banner{background:#e8f5e9;border:1px solid #2e7d32;color:#2e7d32;border-radius:8px;padding:8px;margin-bottom:10px}
canvas{width:100%;height:240px;background:#fff;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}td,th{border-bottom:1px solid #ddd;padding:4px;text-align:left}
</style></head><body>
<header><h1 id="ttl">KneeFit</h1><div class="row"><select id="wk"></select><select id="view"><option value="plan">Workout</option><option value="prog">Progress charts</option><option value="body">Body weight</option><option value="data">Data / backup</option></select></div>
<div class="row" id="tabs" style="margin-top:6px"></div></header>
<main id="main"></main>
<div id="modal"><div><h3 id="mt"></h3><p id="md"></p><button class="b" onclick="document.getElementById('modal').style.display='none'">Close</button></div></div>
<script src="data.js"></script><script src="app.js"></script></body></html>
